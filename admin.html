<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AK Biryani House Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="login"><div class="box"><div class="logo">AK</div><h1>AK Biryani House</h1><p>Admin Dashboard</p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">LOGIN</button><small>Demo: admin / 1234</small></div></div>
<div id="app" class="hide"><aside><h2>AK</h2><p>BIRYANI HOUSE</p><button onclick="tab('dash')">📊 Dashboard</button><button onclick="tab('menu')">🍗 Menu</button><button onclick="tab('orders')">🛒 Orders</button><button onclick="tab('delivery')">🚚 Delivery</button><button onclick="tab('bills')">🧾 Bills</button><button onclick="logout()">↪ Logout</button></aside><main><header><h1 id="title">Dashboard</h1><b>● Restaurant Open</b></header>
<section id="dash"><div class="cards"><div>📦<small>Orders</small><strong id="orders">0</strong></div><div>💰<small>Sales</small><strong id="sales">₹0</strong></div><div>🍗<small>Menu Items</small><strong id="items">9</strong></div><div>🚚<small>Pending</small><strong id="pending">0</strong></div></div><div class="panel"><h2>Quick Actions</h2><button onclick="tab('menu')">➕ Add Menu Item</button><button onclick="tab('orders')">🛒 View Orders</button></div></section>
<section id="menu" class="hide"><div class="panel"><h2>Manage Menu</h2><button onclick="add()">+ Add New Item</button><div id="menutable"></div></div></section>
<section id="orders" class="hide"><div class="panel"><h2>Orders</h2><div id="ordertable">No orders yet.</div></div></section>
<section id="delivery" class="hide"><div class="panel"><h2>Delivery Management</h2><div id="deliverytable">No orders yet.</div></div></section>
<section id="bills" class="hide"><div class="panel"><h2>Bills</h2><div id="billtable">No bills yet.</div></div></section>
</main></div><script src="admin.js"></script></body></html>
